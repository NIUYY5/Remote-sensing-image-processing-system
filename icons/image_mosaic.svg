<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 四个拼接瓦片 -->
  <rect x="2" y="2" width="28" height="28" rx="2" fill="#4A90D9" stroke="#357ABD" stroke-width="1.5" opacity="0.8"/>
  <rect x="34" y="2" width="28" height="28" rx="2" fill="#50B86C" stroke="#3A9E55" stroke-width="1.5" opacity="0.8"/>
  <rect x="2" y="34" width="28" height="28" rx="2" fill="#E8A838" stroke="#D49520" stroke-width="1.5" opacity="0.8"/>
  <rect x="34" y="34" width="28" height="28" rx="2" fill="#D94A4A" stroke="#C53535" stroke-width="1.5" opacity="0.8"/>
  <!-- 拼接标记（十字线） -->
  <line x1="32" y1="0" x2="32" y2="64" stroke="white" stroke-width="2" stroke-dasharray="4,3" opacity="0.9"/>
  <line x1="0" y1="32" x2="64" y2="32" stroke="white" stroke-width="2" stroke-dasharray="4,3" opacity="0.9"/>
  <!-- 中心菱形 -->
  <polygon points="32,24 40,32 32,40 24,32" fill="white" opacity="0.7"/>
</svg>
